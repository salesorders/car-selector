<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Vehicle Selector</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F5F4F0; --surface: #FFFFFF; --border: #E0DDD6;
      --border-focus: #2C2C2A; --text-primary: #1A1A18;
      --text-secondary: #6B6A65; --text-muted: #A09E99;
      --accent: #1A1A18; --accent-fg: #F5F4F0;
      --success-bg: #EAF3DE; --success-text: #27500A;
      --highlight: #E8F0FE;
      --radius: 10px; --font: 'DM Sans', sans-serif; --font-mono: 'DM Mono', monospace;
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text-primary); padding: 1.5rem 1rem; -webkit-text-size-adjust: 100%; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 480px; margin: 0 auto; }

    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .card-title { font-size: 20px; font-weight: 600; color: var(--text-primary); margin-bottom: 1.5rem; }
    .field { margin-bottom: 1rem; }
    label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }

    .step-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; background: var(--border); border-radius: 50%; font-size: 10px; font-weight: 600; color: var(--text-secondary); flex-shrink: 0; transition: background 0.2s, color 0.2s; }
    .step-badge.active { background: var(--accent); color: var(--accent-fg); }
    .step-badge.done   { background: #639922; color: #fff; }

    .hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; min-height: 16px; font-family: var(--font-mono); }

    /* ── Trigger button ── */
    .dd-trigger {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 0.8rem 1rem; font-family: var(--font); font-size: 16px; /* 16px prevents iOS zoom */
      color: var(--text-primary); cursor: pointer;
      text-align: left; user-select: none; -webkit-tap-highlight-color: transparent;
      min-height: 48px; /* minimum touch target */
      transition: border-color 0.15s;
    }
    .dd-trigger:focus { outline: none; border-color: var(--border-focus); }
    .dd-trigger.disabled { opacity: 0.4; pointer-events: none; }
    .dd-trigger .placeholder { color: var(--text-muted); }
    .dd-arrow { flex-shrink: 0; transition: transform 0.2s; }
    .dd-trigger.open .dd-arrow { transform: rotate(180deg); }

    /* ── Modal overlay (shared for all dropdowns) ── */
    .dd-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 1000;
      align-items: flex-end; /* sheet slides up from bottom */
      justify-content: center;
    }
    .dd-overlay.open { display: flex; }

    .dd-sheet {
      background: var(--surface); border-radius: 20px 20px 0 0;
      width: 100%; max-width: 540px;
      max-height: 75vh; display: flex; flex-direction: column;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .dd-sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.25rem 0.75rem; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .dd-sheet-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .dd-close {
      background: none; border: none; cursor: pointer; padding: 4px;
      color: var(--text-muted); font-size: 22px; line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .dd-search-wrap { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .dd-search-wrap input {
      width: 100%; border: 1px solid var(--border); border-radius: 8px;
      padding: 0.6rem 0.8rem; font-family: var(--font); font-size: 16px; /* prevent iOS zoom */
      color: var(--text-primary); background: var(--bg);
    }
    .dd-search-wrap input:focus { outline: none; border-color: var(--border-focus); }

    .dd-options { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; padding: 6px 0; }

    .dd-option {
      padding: 14px 1.25rem; font-size: 16px; cursor: pointer;
      color: var(--text-primary); border-bottom: 1px solid var(--border);
      -webkit-tap-highlight-color: transparent; user-select: none;
      display: flex; align-items: center; min-height: 48px;
    }
    .dd-option:last-child { border-bottom: none; }
    .dd-option:active { background: var(--highlight); }
    .dd-option.selected { background: var(--highlight); font-weight: 500; }
    .dd-empty { padding: 1rem 1.25rem; font-size: 14px; color: var(--text-muted); }

    /* ── Result ── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0 1rem; }
    .result-block { background: var(--success-bg); border-radius: var(--radius); padding: 1rem 1.1rem; display: none; animation: fadeUp 0.2s ease; }
    .result-block.visible { display: block; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .result-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--success-text); opacity: 0.7; margin-bottom: 4px; }
    .result-value { font-size: 17px; font-weight: 600; color: var(--success-text); }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .tag { display: inline-block; background: rgba(99,153,34,0.15); color: var(--success-text); font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; font-family: var(--font-mono); }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font); font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; background: var(--surface); color: var(--text-primary); min-height: 44px; -webkit-tap-highlight-color: transparent; }
    .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .footer-note { margin-top: 1.25rem; font-size: 11px; color: var(--text-muted); text-align: center; font-family: var(--font-mono); }
  </style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Vehicle lookup</p>
  <h1 class="card-title">Select your vehicle</h1>

  <div class="field">
    <label><span class="step-badge active" id="badge-1">1</span> Make</label>
    <button class="dd-trigger" id="make-trigger" type="button">
      <span id="make-label" class="placeholder">— Select make —</span>
      <svg class="dd-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A09E99" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <p class="hint" id="make-hint"></p>
  </div>

  <div class="field">
    <label><span class="step-badge" id="badge-2">2</span> Model</label>
    <button class="dd-trigger disabled" id="model-trigger" type="button">
      <span id="model-label" class="placeholder">Select a make first</span>
      <svg class="dd-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A09E99" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <p class="hint" id="model-hint"></p>
  </div>

  <div class="field">
    <label><span class="step-badge" id="badge-3">3</span> Year</label>
    <button class="dd-trigger disabled" id="year-trigger" type="button">
      <span id="year-label" class="placeholder">Select a model first</span>
      <svg class="dd-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A09E99" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <p class="hint" id="year-hint"></p>
  </div>

  <hr class="divider" />

  <div class="result-block" id="result-block">
    <p class="result-label">Selected vehicle</p>
    <p class="result-value" id="result-text"></p>
    <div class="tags">
      <span class="tag" id="tag-make"></span>
      <span class="tag" id="tag-model"></span>
      <span class="tag" id="tag-year"></span>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="copy-btn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
      <button class="btn" id="reset-btn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.15"/></svg>
        Reset
      </button>
    </div>
  </div>

  <p class="footer-note">27 popular makes · all US market models</p>
</div>

<!-- Single shared modal sheet for all dropdowns -->
<div class="dd-overlay" id="dd-overlay">
  <div class="dd-sheet">
    <div class="dd-sheet-header">
      <span class="dd-sheet-title" id="sheet-title">Select</span>
      <button class="dd-close" id="sheet-close" type="button">&#215;</button>
    </div>
    <div class="dd-search-wrap" id="sheet-search-wrap">
      <input type="search" id="sheet-search" placeholder="Search…" autocomplete="off" autocorrect="off" autocapitalize="off" />
    </div>
    <div class="dd-options" id="sheet-options"></div>
  </div>
</div>

};

const makes = Object.keys(VEHICLE_DATA).sort();
let selectedMake = '', selectedModel = '', selectedYear = '', currentValue = '';
let activeDropdown = null; // 'make' | 'model' | 'year'
const insideJotForm = (window.self !== window.top);

// ── Shared modal sheet ────────────────────────────────────────────────────
const overlay    = document.getElementById('dd-overlay');
const sheetTitle = document.getElementById('sheet-title');
const sheetSearch = document.getElementById('sheet-search');
const sheetSearchWrap = document.getElementById('sheet-search-wrap');
const sheetOptions = document.getElementById('sheet-options');

function openSheet(title, items, onSelect, showSearch) {
  sheetTitle.textContent = title;
  sheetSearch.value = '';
  sheetSearchWrap.style.display = showSearch ? 'block' : 'none';
  renderSheetOptions(items, onSelect, '');
  overlay.classList.add('open');
  if (showSearch) setTimeout(() => sheetSearch.focus(), 300);
  resizeFrame();

  sheetSearch.oninput = function() {
    renderSheetOptions(items, onSelect, this.value);
  };
}

function renderSheetOptions(items, onSelect, filter) {
  sheetOptions.innerHTML = '';
  const filtered = filter ? items.filter(i => i.toLowerCase().includes(filter.toLowerCase())) : items;
  if (!filtered.length) {
    sheetOptions.innerHTML = '<div class="dd-empty">No results</div>';
    return;
  }
  filtered.forEach(function(item) {
    const div = document.createElement('div');
    div.className = 'dd-option';
    div.textContent = item;
    // Use both touchend and click for cross-device compatibility
    function handleSelect(e) {
      e.preventDefault();
      closeSheet();
      onSelect(item);
    }
    div.addEventListener('touchend', handleSelect, { passive: false });
    div.addEventListener('click', handleSelect);
    sheetOptions.appendChild(div);
  });
}

function closeSheet() {
  overlay.classList.remove('open');
  sheetSearch.oninput = null;
  resizeFrame();
}

// Close on overlay background tap
overlay.addEventListener('touchend', function(e) { if (e.target === overlay) closeSheet(); });
overlay.addEventListener('click', function(e) { if (e.target === overlay) closeSheet(); });
document.getElementById('sheet-close').addEventListener('click', closeSheet);
document.getElementById('sheet-close').addEventListener('touchend', function(e) { e.preventDefault(); closeSheet(); });

// ── Helpers ───────────────────────────────────────────────────────────────
function setBadge(n, state) {
  const b = document.getElementById('badge-' + n);
  b.className = 'step-badge' + (state === 'active' ? ' active' : state === 'done' ? ' done' : '');
  b.innerHTML = state === 'done' ? '&#10003;' : n;
}

function sendValue(val) {
  if (insideJotForm) JFCustomWidget.sendData({ value: val });
}

function resizeFrame() {
  if (insideJotForm) {
    JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight + 20 });
  }
}

function tap(el, fn) {
  // Unified tap handler — fires on touchend to avoid 300ms delay, falls back to click
  let touched = false;
  el.addEventListener('touchend', function(e) {
    touched = true;
    e.preventDefault();
    fn.call(this, e);
    setTimeout(() => { touched = false; }, 500);
  }, { passive: false });
  el.addEventListener('click', function(e) {
    if (!touched) fn.call(this, e);
  });
}

// ── Make trigger ──────────────────────────────────────────────────────────
tap(document.getElementById('make-trigger'), function() {
  openSheet('Select Make', makes, function(make) {
    selectedMake  = make;
    selectedModel = '';
    selectedYear  = '';
    currentValue  = '';

    document.getElementById('make-label').textContent = make;
    document.getElementById('make-label').classList.remove('placeholder');
    document.getElementById('make-hint').textContent = VEHICLE_DATA[make].length + ' models available';

    document.getElementById('model-trigger').classList.remove('disabled');
    document.getElementById('model-label').textContent = '— Select model —';
    document.getElementById('model-label').classList.add('placeholder');
    document.getElementById('model-hint').textContent = '';

    document.getElementById('year-trigger').classList.add('disabled');
    document.getElementById('year-label').textContent = 'Select a model first';
    document.getElementById('year-label').classList.add('placeholder');
    document.getElementById('year-hint').textContent = '';

    document.getElementById('result-block').classList.remove('visible');
    sendValue('');
    setBadge(1, 'done'); setBadge(2, 'active'); setBadge(3, '');
    resizeFrame();
  }, true);
});

// ── Model trigger ─────────────────────────────────────────────────────────
tap(document.getElementById('model-trigger'), function() {
  if (this.classList.contains('disabled')) return;
  const models = VEHICLE_DATA[selectedMake] || [];
  openSheet('Select Model', models, function(model) {
    selectedModel = model;
    selectedYear  = '';
    currentValue  = '';

    document.getElementById('model-label').textContent = model;
    document.getElementById('model-label').classList.remove('placeholder');
    document.getElementById('model-hint').textContent = '';

    document.getElementById('year-trigger').classList.remove('disabled');
    document.getElementById('year-label').textContent = '— Select year —';
    document.getElementById('year-label').classList.remove('placeholder');
    document.getElementById('year-hint').textContent = 'Model years 1981–' + (new Date().getFullYear() + 1);

    document.getElementById('result-block').classList.remove('visible');
    sendValue('');
    setBadge(2, 'done'); setBadge(3, 'active');
    resizeFrame();
  }, true);
});

// ── Year trigger ──────────────────────────────────────────────────────────
tap(document.getElementById('year-trigger'), function() {
  if (this.classList.contains('disabled')) return;
  const currentYear = new Date().getFullYear() + 1;
  const years = [];
  for (let y = currentYear; y >= 1981; y--) years.push(String(y));
  openSheet('Select Year', years, function(year) {
    selectedYear = year;
    const vehicle = year + ' ' + selectedMake + ' ' + selectedModel;
    currentValue  = vehicle;

    document.getElementById('year-label').textContent = year;
    document.getElementById('year-label').classList.remove('placeholder');
    document.getElementById('year-hint').textContent = '';

    document.getElementById('result-text').textContent = vehicle;
    document.getElementById('tag-make').textContent  = selectedMake;
    document.getElementById('tag-model').textContent = selectedModel;
    document.getElementById('tag-year').textContent  = year;
    document.getElementById('result-block').classList.add('visible');

    setBadge(3, 'done');
    sendValue(vehicle);
    resizeFrame();
  }, false);
});

// ── Copy & Reset ──────────────────────────────────────────────────────────
tap(document.getElementById('copy-btn'), function() {
  if (!currentValue) return;
  navigator.clipboard.writeText(currentValue).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy'; }, 1800);
  });
});

tap(document.getElementById('reset-btn'), function() {
  selectedMake = ''; selectedModel = ''; selectedYear = ''; currentValue = '';
  document.getElementById('make-label').textContent  = '— Select make —';
  document.getElementById('make-label').classList.add('placeholder');
  document.getElementById('model-label').textContent = 'Select a make first';
  document.getElementById('model-label').classList.add('placeholder');
  document.getElementById('year-label').textContent  = 'Select a model first';
  document.getElementById('year-label').classList.add('placeholder');
  document.getElementById('make-hint').textContent   = makes.length + ' makes available';
  document.getElementById('model-hint').textContent  = '';
  document.getElementById('year-hint').textContent   = '';
  document.getElementById('model-trigger').classList.add('disabled');
  document.getElementById('year-trigger').classList.add('disabled');
  document.getElementById('result-block').classList.remove('visible');
  setBadge(1, 'active'); setBadge(2, ''); setBadge(3, '');
  sendValue('');
  resizeFrame();
});

// ── Init ──────────────────────────────────────────────────────────────────
function init() {
  document.getElementById('make-hint').textContent = makes.length + ' makes available';
  setBadge(1, 'active');
  resizeFrame();
}

if (insideJotForm) {
  JFCustomWidget.subscribe("ready", function() {
    var existing = JFCustomWidget.getValue();
    if (existing) currentValue = existing;
    init();
  });
  JFCustomWidget.subscribe("submit", function() {
    JFCustomWidget.sendSubmit({ valid: !!currentValue, value: currentValue });
  });
} else {
  init();
}
</script>
</body>
</html>
